[package]
name = "u-words"
version = "0.8.0"
description = "A lightweight local voice-to-text desktop app"
authors = ["U-Words"]
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
cpal = "0.15.3"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"
arboard = "3.6.1"
dirs = "6.0.0"
enigo = "0.6.1"
keyring = "4.2.0"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.6.3", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.3.0"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time", "process"] }
whisper-rs = "0.16.0"

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit identifies the frontmost app without asking for Automation access to
# System Events. objc2 is used by AppKit's generated bindings.
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSAccessibility", "NSRunningApplication", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSColor", "objc2-quartz-core", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGColor", "CGColorSpace", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSProcessInfo", "std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "CATransaction", "CATransform3D", "CAMediaTiming", "CAMediaTimingFunction", "objc2-core-foundation", "objc2-core-graphics", "std"] }
